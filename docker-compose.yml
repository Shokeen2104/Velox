version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: swarmshare
      POSTGRES_PASSWORD: password
      POSTGRES_DB: swarmshare
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmshare -d swarmshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning

volumes:
  pgdata:
  redisdata:
